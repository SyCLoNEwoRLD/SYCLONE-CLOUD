# Proxy settings shared by both COMBIND portals (/etc/nginx/snippets/combind-proxy.conf).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The hub reads the client address from X-Real-IP only; nginx always overwrites it.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
# Read and send timeouts are set per location: the data path needs far longer ones.
